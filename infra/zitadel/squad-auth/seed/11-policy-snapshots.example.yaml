    version: "v1.2.0"
    effectiveDates:
      start: "2026-06-07T00:00:00Z"
      end: null
    namespace: "squados.dispatch.standard"
    description: "Standard dispatch policy for Q2"
    roleGroupsAffected:
      - technician
      - msp
    relationshipGrantReferences:
      - may_send_workblocks_to
      - may_request_acceptance_from
    workblockActionClasses:

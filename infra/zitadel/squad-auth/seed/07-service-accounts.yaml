# 07-service-accounts.yaml
# Service accounts for machine-to-machine communication

serviceAccounts:
  - id: svc-squad-auth-config-export
    name: Config Export Worker
    projectId: project-auth-admin
    environment: prod
    purpose: Nightly export of ZITADEL config for GitOps tracking
    roles:
      - authadmin.project.read
      - authadmin.role.taxonomy.read
      - authadmin.grant.read
    tokenStrategy: JWT_PROFILE
    owner: org-NL-A001
    auditNote: "Read-only access to config"

  - id: svc-squad-auth-seed-apply
    name: Config Seed Apply Worker
    projectId: project-auth-admin
    environment: dev # Only allowed in dev/staging natively
    purpose: Applies YAML definitions to ZITADEL
    roles:
      - authadmin.org.create
      - authadmin.project.manage
      - authadmin.role.taxonomy.manage
      - authadmin.project.grant
    tokenStrategy: JWT_PROFILE
    owner: org-NL-A001

  - id: svc-policy-snapshot-worker
    name: Policy Snapshot Worker
    projectId: project-control-plane
    environment: prod
    purpose: Periodically creates immutable snapshots of active policies (drafts only, requires human publish)
    roles:
      - controlplane.policy.draft
    tokenStrategy: JWT_PROFILE
    owner: org-NL-A001
    auditNote: "Drafts policies. Publish authority requires platform mediation."

  - id: svc-projection-worker
    name: Projection Worker
    projectId: project-agent-runtime
    environment: prod
    purpose: Refreshes materialized views based on events
    roles:
      - agent.projection.refresh
    tokenStrategy: JWT_PROFILE
    owner: org-NL-A001

  - id: svc-sense-ingest
    name: Sense Ingest API
    projectId: project-sense
    environment: prod
    purpose: Submits raw events into the Sense signal processing queue
    roles:
      - sense.signal.ingest
    tokenStrategy: JWT_PROFILE
    owner: org-NL-A001

  - id: svc-workblock-agent-runtime
    name: Workblock AI Agent Runtime
    projectId: project-agent-runtime
    environment: prod
    purpose: Evaluates workblock states and proposes next actions
    roles:
      - agent.workblock.read
      - agent.workblock.summarize
      - agent.evidence.summarize
      - agent.recommendation.draft
    tokenStrategy: JWT_PROFILE
    owner: org-NL-A001
    auditNote: "Must not possess execute/write authority without human graduation"
